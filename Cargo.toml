[package]
name = "lintel"
version = "0.1.0"
edition = "2021"
description = "An event-driven bar for sway: modules, tray, launcher, notifications and a pomodoro, in one GTK 4 process."
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs", "signal"] }
async-channel = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
swayipc-async = "3"
udev = "0.9"
nix = { version = "0.29", features = ["socket", "time", "poll", "net"] }
chrono = { version = "0.4", features = ["unstable-locales"] }
anyhow = "1"
libc = "0.2"
libpulse-binding = "2"
fuzzy-matcher = "0.3"

[profile.release]
opt-level = 2
strip = true
